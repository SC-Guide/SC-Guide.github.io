<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320">
  <defs>
    <style>
      .ic { fill: none; stroke: #B96A50; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .bg { fill: #F6EAE3; }
      .label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11px; fill: #8A7A73; text-anchor: middle; }
    </style>
  </defs>

  <!-- ===== ROW 1 ===== -->

  <!-- 1. Morning (sun) -->
  <g transform="translate(20,20)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,20)" class="ic">
      <circle cx="20" cy="20" r="8"/>
      <line x1="20" y1="2" x2="20" y2="6"/>
      <line x1="20" y1="34" x2="20" y2="38"/>
      <line x1="2" y1="20" x2="6" y2="20"/>
      <line x1="34" y1="20" x2="38" y2="20"/>
      <line x1="7.5" y1="7.5" x2="10.2" y2="10.2"/>
      <line x1="29.8" y1="29.8" x2="32.5" y2="32.5"/>
      <line x1="7.5" y1="32.5" x2="10.2" y2="29.8"/>
      <line x1="29.8" y1="10.2" x2="32.5" y2="7.5"/>
    </g>
    <text class="label" x="40" y="105">Morning</text>
  </g>

  <!-- 2. Evening (crescent moon) -->
  <g transform="translate(140,20)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,20)" class="ic">
      <path d="M28 26.5A14 14 0 1 1 13.5 12 11 11 0 0 0 28 26.5Z"/>
    </g>
    <text class="label" x="40" y="105">Evening</text>
  </g>

  <!-- 3. Kit (dropper bottle) -->
  <g transform="translate(260,20)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,18)" class="ic">
      <rect x="10" y="14" width="20" height="24" rx="5"/>
      <path d="M15 14 L15 6 A5 5 0 0 1 25 6 L25 14"/>
      <line x1="12" y1="8" x2="28" y2="8"/>
      <line x1="16" y1="24" x2="24" y2="24"/>
      <line x1="16" y1="30" x2="24" y2="30"/>
    </g>
    <text class="label" x="40" y="105">Kit</text>
  </g>

  <!-- 4. Rules (checklist) -->
  <g transform="translate(380,20)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,20)" class="ic">
      <rect x="4" y="2" width="32" height="36" rx="5"/>
      <path d="M12 15l3 3 6-7"/>
      <line x1="24" y1="14" x2="30" y2="14"/>
      <line x1="12" y1="26" x2="30" y2="26"/>
      <line x1="12" y1="31" x2="24" y2="31"/>
    </g>
    <text class="label" x="40" y="105">Rules</text>
  </g>

  <!-- 5. Shops (bag) -->
  <g transform="translate(500,20)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,20)" class="ic">
      <path d="M8 12h24l-2 24a3 3 0 0 1-3 3H13a3 3 0 0 1-3-3L8 12Z"/>
      <path d="M14 12V9a6 6 0 0 1 12 0v3"/>
    </g>
    <text class="label" x="40" y="105">Shops</text>
  </g>

  <!-- 6. Calendar -->
  <g transform="translate(620,20)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,20)" class="ic">
      <rect x="4" y="6" width="32" height="30" rx="5"/>
      <line x1="4" y1="15" x2="36" y2="15"/>
      <line x1="12" y1="2" x2="12" y2="9"/>
      <line x1="28" y1="2" x2="28" y2="9"/>
      <circle cx="14" cy="23" r="1.6" fill="#B96A50" stroke="none"/>
      <circle cx="20" cy="23" r="1.6" fill="#B96A50" stroke="none"/>
      <circle cx="26" cy="23" r="1.6" fill="#B96A50" stroke="none"/>
      <circle cx="14" cy="29" r="1.6" fill="#B96A50" stroke="none"/>
    </g>
    <text class="label" x="40" y="105">Calendar</text>
  </g>

  <!-- 7. My Products (heart-jar) -->
  <g transform="translate(740,20)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,20)" class="ic">
      <rect x="6" y="12" width="28" height="24" rx="6"/>
      <line x1="6" y1="20" x2="34" y2="20"/>
      <path d="M20 30l-4.2-4a3 3 0 1 1 4.2-4.3A3 3 0 1 1 24.2 26L20 30Z" fill="#B96A50" stroke="none"/>
    </g>
    <text class="label" x="40" y="105">My Products</text>
  </g>

  <!-- 8. Settings (gear) -->
  <g transform="translate(860,20)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,20)" class="ic">
      <circle cx="20" cy="20" r="6"/>
      <path d="M20 4v4M20 32v4M36 20h-4M8 20H4M30.9 9.1l-2.8 2.8M11.9 28.1l-2.8 2.8M30.9 30.9l-2.8-2.8M11.9 11.9L9.1 9.1"/>
    </g>
    <text class="label" x="40" y="105">Settings</text>
  </g>

  <!-- ===== ROW 2 ===== -->

  <!-- 9. Home -->
  <g transform="translate(20,160)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,20)" class="ic">
      <path d="M4 18L20 5l16 13"/>
      <path d="M8 15v18a2 2 0 0 0 2 2h20a2 2 0 0 0 2-2V15"/>
      <path d="M16 35V24h8v11"/>
    </g>
    <text class="label" x="40" y="245">Home</text>
  </g>

  <!-- 10. Planner (clipboard) -->
  <g transform="translate(140,160)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,20)" class="ic">
      <rect x="7" y="5" width="26" height="32" rx="4"/>
      <rect x="14" y="2" width="12" height="6" rx="2"/>
      <line x1="13" y1="17" x2="27" y2="17"/>
      <line x1="13" y1="24" x2="27" y2="24"/>
      <line x1="13" y1="31" x2="21" y2="31"/>
    </g>
    <text class="label" x="40" y="245">Planner</text>
  </g>

  <!-- 11. Demo (doc) -->
  <g transform="translate(260,160)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,20)" class="ic">
      <path d="M10 2h13l7 7v27a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z"/>
      <path d="M23 2v7h7"/>
      <line x1="12" y1="20" x2="26" y2="20"/>
      <line x1="12" y1="26" x2="26" y2="26"/>
    </g>
    <text class="label" x="40" y="245">Demo</text>
  </g>

  <!-- 12. Language (globe) -->
  <g transform="translate(380,160)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,20)" class="ic">
      <circle cx="20" cy="20" r="16"/>
      <ellipse cx="20" cy="20" rx="7" ry="16"/>
      <line x1="4" y1="20" x2="36" y2="20"/>
      <path d="M6.5 11.5h27M6.5 28.5h27"/>
    </g>
    <text class="label" x="40" y="245">Language</text>
  </g>

  <!-- 13. Sign in (user) -->
  <g transform="translate(500,160)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,20)" class="ic">
      <circle cx="20" cy="14" r="7"/>
      <path d="M6 36c0-8 6-13 14-13s14 5 14 13"/>
    </g>
    <text class="label" x="40" y="245">Sign in</text>
  </g>

  <!-- 14. Progress/streak (flame) -->
  <g transform="translate(620,160)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,20)" class="ic">
      <path d="M20 3c2 6-6 8-6 15a6 6 0 0 0 12 0c0-3-2-4-2-7 3 2 5 6 5 10a9 9 0 0 1-18 0C11 13 16 9 20 3Z"/>
    </g>
    <text class="label" x="40" y="245">Streak</text>
  </g>

  <!-- 15. Notes/journal (leaf, skincare touch) -->
  <g transform="translate(740,160)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,20)" class="ic">
      <path d="M6 34C6 16 20 6 34 6 34 24 20 34 6 34Z"/>
      <path d="M6 34C14 26 20 18 30 10"/>
    </g>
    <text class="label" x="40" y="245">Skin Journal</text>
  </g>

  <!-- 16. Warning/patch test (drop with exclamation) -->
  <g transform="translate(860,160)">
    <rect class="bg" width="80" height="80" rx="20"/>
    <g transform="translate(20,20)" class="ic">
      <path d="M20 3c7 9 12 15.5 12 21.5a12 12 0 0 1-24 0C8 18.5 13 12 20 3Z"/>
      <line x1="20" y1="17" x2="20" y2="25"/>
      <circle cx="20" cy="30" r="0.9" fill="#B96A50" stroke="none"/>
    </g>
    <text class="label" x="40" y="245">Patch Test</text>
  </g>

</svg>
