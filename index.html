<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Skincare Guide — Your step-by-step guide to safe active skincare" />
<meta property="og:description" content="An interactive skincare routine planner with a snake‑style calendar, bilingual interface, and automated retinal/azelaic scheduling." />
<meta property="og:image" content="https://vyshnevska2503-code.github.io/SkinGuide/og-image-en.png" />
<meta property="og:url" content="https://vyshnevska2503-code.github.io/SkinGuide/" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23715A5A'/%3E%3Ctext x='50' y='70' font-family='Georgia, serif' font-size='56' font-weight='700' fill='%23D3DAD9' text-anchor='middle'%3ESG%3C/text%3E%3C/svg%3E" type="image/svg+xml">
<title>Skincare Guide — Your step-by-step guide to safe active skincare</title>
<link rel="stylesheet" href="css/style.css">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
  <div class="wrap">
    <div class="header-top">
      <div>
        <p class="title"><span class="accent">Skincare</span> Guide</p>
        <p class="subtitle" id="siteSubtitle"></p>
      </div>
      <div class="tools">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search" type="text" placeholder="">
        </div>
        <button class="pill-toggle" id="recToggle"><span id="recToggleLabel"></span></button>
        <button class="lang-toggle" id="langToggle">🇬🇧 EN</button>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌓</button>
        <button class="pill-toggle" id="authBtn">Sign in with Google</button>
        <span class="result-count" id="resultCount"></span>
      </div>
    </div>
    <nav id="mainNav">
      <a href="#morning" data-nav="morning">Morning</a>
      <a href="#evening" data-nav="evening">Evening</a>
      <a href="#kit" data-nav="kit">Kit</a>
      <a href="#rules" data-nav="rules">Rules</a>
      <a href="#shops" data-nav="shops">Shops</a>
      <a href="#calendar" data-nav="calendar">Calendar</a>
      <a href="#myproducts" data-nav="myproducts">My Products</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <div class="stats">
      <div class="stat"><div class="stat-icon">☀️</div><div><div class="num">4</div><div class="lbl" id="statMorningLbl"></div></div></div>
      <div class="stat"><div class="stat-icon">🌙</div><div><div class="num">5</div><div class="lbl" id="statEveningLbl"></div></div></div>
      <div class="stat"><div class="stat-icon">🧴</div><div><div class="num">6</div><div class="lbl" id="statKitLbl"></div></div></div>
      <div class="stat"><div class="stat-icon">📋</div><div><div class="num">8</div><div class="lbl" id="statRulesLbl"></div></div></div>
    </div>
  </div>

  <div class="no-results" id="noResults"></div>

  <section class="zone morning" id="morning">
    <div class="zone-head"><div class="zone-icon">☀️</div><p class="zone-title" id="titleMorning"></p></div>
    <div class="path" id="morning-path"></div>
  </section>

  <section class="zone evening" id="evening">
    <div class="zone-head"><div class="zone-icon">🌙</div><p class="zone-title" id="titleEvening"></p></div>
    <div class="path" id="evening-path"></div>
  </section>

  <section class="zone" id="kit">
    <div class="zone-head"><div class="zone-icon">🧴</div><p class="zone-title" id="titleKit"></p></div>
    <p class="zone-sub" id="subKit"></p>
    <div id="kit-groups"></div>
  </section>

  <section class="zone" id="rules">
    <div class="zone-head"><div class="zone-icon">📋</div><p class="zone-title" id="titleRules"></p></div>
    <div class="rules-grid" id="rules-grid"></div>
  </section>

  <section class="shops-section" id="shops">
    <div class="zone-head"><div class="zone-icon">🛒</div><p class="zone-title" id="titleShops"></p></div>
    <p class="zone-sub" id="subShops"></p>
    <div class="shops-grid" id="shops-grid"></div>
  </section>

  <section class="zone" id="calendar" style="scroll-margin-top:120px;">
    <div class="zone-head"><div class="zone-icon">📅</div><p class="zone-title" id="titleCalendar"></p></div>
    <div class="calendar-wrapper">
      <div class="calendar-header">
        <h2 id="calendarMonthLabel"></h2>
        <div class="calendar-nav">
          <button id="prevMonthBtn">‹</button>
          <button id="nextMonthBtn">›</button>
          <button class="settings-btn" id="settingsBtn" title="Settings">⚙</button>
        </div>
      </div>
      <div class="snake-container" id="snakeContainer"></div>
    </div>
  </section>

  <section class="zone" id="myproducts" style="scroll-margin-top:120px;">
    <div class="zone-head"><div class="zone-icon">🧴</div><p class="zone-title" id="titleMyProducts"></p></div>
    <p class="zone-sub" id="subMyProducts"></p>
    <div id="my-products-container"></div>
  </section>
</div>

<footer>
  <div class="wrap">
    <p id="footerLine"></p>
    <p class="footer-credit" id="footerCredit"></p>
    <p class="footer-disclaimer" id="footerDisclaimer"></p>
  </div>
</footer>

<script src="js/firebase.js"></script>
<script src="js/data.js"></script>
<script src="js/lang.js"></script>
<script src="js/icons.js"></script>
<script src="js/products.js"></script>
<script src="js/calendar.js"></script>
<script src="js/modals.js"></script>
<script src="js/filters.js"></script>
<script src="js/app.js"></script>
</body>
</html>
