<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skincare Guide — Портфолио-проект</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');

:root{
  --bg:#F3E4C9;
  --surface:#FFFFFF;
  --morning:#BFA28C;
  --morning-deep:#A98B76;
  --morning-ink:#5D3F2E;
  --evening:#BFA28C;
  --evening-deep:#A98B76;
  --evening-ink:#5D3F2E;
  --spot:#BABF94;
  --spot-deep:#7A8F5F;
  --mask:#BABF94;
  --mask-deep:#7A8F5F;
  --scrub:#BABF94;
  --scrub-deep:#7A8F5F;
  --danger-bg:#FAD9D9;
  --danger-border:#E3A0A0;
  --danger-ink:#961E1E;
  --ink:#18170F;
  --ink-soft:#514E43;
  --ink-faint:#84806F;
  --line:#BABF94;
  --star:#A98B76;
  --lux:#1A1913;
  --lux-accent:#B4903D;
  --lux-bg:#F1ECE0;
  --radius:14px;
  --shadow-card:0 10px 28px rgba(24,23,15,0.14);
  --shadow-header:0 4px 20px rgba(24,23,15,0.07);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{-webkit-tap-highlight-color:transparent;}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px;}

/* ---------- HEADER ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,0.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  box-shadow:var(--shadow-header);
}
.header-top{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:18px 0 12px;flex-wrap:wrap;gap:10px;
}
.title{font-family:'Playfair Display',serif;font-size:clamp(20px,5vw,27px);font-weight:700;letter-spacing:-0.01em;margin:0;}
.title .accent{color:var(--morning-deep);font-style:italic;}
.subtitle{font-size:clamp(11.5px,3vw,13px);color:var(--ink-soft);margin:4px 0 0;font-weight:500;max-width:440px;line-height:1.45;}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:14px;width:100%;}
.result-count{font-size:12px;color:var(--morning-deep);font-weight:600;white-space:nowrap;padding:0 2px;}
.search-box{position:relative;flex:1;min-width:150px;max-width:280px;}
.search-box input{
  width:100%;padding:11px 14px 11px 34px;border-radius:999px;min-height:44px;
  border:1px solid var(--line);background:var(--bg);
  font-family:inherit;font-size:13px;color:var(--ink);outline:none;
}
.search-box input:focus{border-color:var(--ink-faint);}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:0.4;}
.pill-toggle{
  display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;min-height:44px;
  border:1px solid var(--line);background:var(--bg);cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:500;color:var(--ink-soft);
  transition:all .15s ease;user-select:none;white-space:nowrap;
}
.pill-toggle svg{opacity:0.55;}
.pill-toggle.active{background:#FBF4E1;border-color:#E3CE8F;color:var(--star);}
.pill-toggle.active svg{opacity:1;}
.lang-toggle{
  display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 14px;border-radius:999px;min-height:44px;min-width:44px;
  border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:0.03em;
  transition:transform .15s ease,opacity .15s ease;user-select:none;white-space:nowrap;
}
.lang-toggle:hover{opacity:0.85;}
.lang-toggle:active{transform:scale(0.96);}
nav{display:flex;gap:6px;padding-bottom:14px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;}
nav::-webkit-scrollbar{display:none;}
nav a{
  white-space:nowrap;text-decoration:none;color:var(--ink-soft);
  font-size:13px;font-weight:600;padding:11px 16px;border-radius:999px;min-height:44px;
  display:inline-flex;align-items:center;
  letter-spacing:0.01em;transition:background .15s ease,color .15s ease,transform .15s ease;
}
nav a:hover{background:var(--morning);color:var(--morning-ink);transform:translateY(-1px);}

/* ---------- HERO / STATS ---------- */
.hero{padding:32px 0 12px;}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px;}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;display:flex;align-items:center;gap:10px;
  transition:transform .15s ease,box-shadow .15s ease;min-width:0;
}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-card);}
.stat-icon{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.stat.stat-morning .stat-icon{background:var(--morning);color:var(--morning-deep);}
.stat.stat-evening .stat-icon{background:var(--evening);color:var(--evening-deep);}
.stat.stat-kit .stat-icon{background:var(--spot);color:var(--spot-deep);}
.stat.stat-rules .stat-icon{background:#EFEAE0;color:#7A6A4B;}
.stat .num{font-size:clamp(20px,4vw,28px);font-weight:800;line-height:1;}
.stat.stat-morning .num{color:var(--morning-deep);}
.stat.stat-evening .num{color:var(--evening-deep);}
.stat.stat-kit .num{color:var(--spot-deep);}
.stat.stat-rules .num{color:#7A6A4B;}
.stat .lbl{font-size:10.5px;color:var(--ink-soft);margin-top:3px;font-weight:600;letter-spacing:0.02em;}

.no-results{display:none;text-align:center;padding:60px 20px;color:var(--ink-faint);font-size:14px;}

/* ---------- ZONES ---------- */
section.zone{padding:52px 0 10px;scroll-margin-top:150px;}
.zone-head{display:flex;align-items:center;gap:14px;margin-bottom:8px;}
.zone-icon{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.zone-icon.morning{background:var(--morning);color:var(--morning-ink);}
.zone-icon.evening{background:var(--evening);color:var(--evening-ink);}
.zone-icon.kit{background:var(--spot);color:var(--spot-deep);}
.zone-icon.rules{background:#EFEAE0;color:#7A6A4B;}
.zone-title{font-family:'Playfair Display',serif;font-size:clamp(19px,4vw,23px);font-weight:700;letter-spacing:-0.01em;margin:0;}
.zone-sub{font-size:13px;color:var(--ink-soft);margin:16px 0 0;max-width:560px;line-height:1.6;}

.path{position:relative;margin-top:30px;}
.step{position:relative;padding-left:46px;padding-bottom:36px;}
.step:last-child{padding-bottom:4px;}
.step::before{
  content:'';position:absolute;left:15px;top:34px;bottom:0;width:1px;background:var(--line);
}
.step:last-child::before{display:none;}
.step-node{
  position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
}
.morning .step-node{background:var(--morning);color:var(--morning-ink);}
.evening .step-node{background:var(--evening);color:var(--evening-ink);}
.step-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin:5px 0 14px;}

.split{display:grid;grid-template-columns:1fr;gap:18px;}
.split-col-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);margin-bottom:11px;}

.card-row{display:grid;grid-template-columns:1fr;gap:14px;}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;display:flex;gap:12px;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  box-shadow:0 1px 2px rgba(24,23,15,0.05);
}
.card:hover{transform:translateY(-3px);border-color:var(--ink-faint);box-shadow:var(--shadow-card);}
.card.lux-card{background:var(--lux-bg);border-color:#DDD0AC;}
.card.lux-card:hover{border-color:var(--lux-accent);}
.card[data-rec="1"]{
  border-left:3px solid var(--morning-deep);
  background:linear-gradient(90deg,rgba(39,106,58,0.07),rgba(39,106,58,0) 40%),var(--surface);
}
.card[data-rec="1"]:hover{border-left-color:var(--morning-deep);}
.card-icon{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.morning .card-icon{background:var(--morning);color:var(--morning-ink);}
.evening .card-icon{background:var(--evening);color:var(--evening-ink);}
.card-body{flex:1;min-width:0;}
.card-name-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.card-name{font-size:13.5px;font-weight:600;line-height:1.35;}
.card-price{font-size:12.5px;color:var(--ink-soft);font-weight:600;white-space:nowrap;flex-shrink:0;}
.star-badge{display:inline-flex;align-items:center;gap:3px;color:var(--star);font-size:11px;font-weight:600;margin-top:3px;}
.lux-badge{display:inline-flex;align-items:center;gap:4px;color:var(--lux);background:linear-gradient(90deg,#EFE4C8,#F6EFDC);border:1px solid var(--lux-accent);padding:2px 8px 2px 6px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;margin-top:3px;}
.lux-badge svg{flex-shrink:0;}
.card-comment{font-size:12px;color:var(--ink-soft);line-height:1.5;margin:6px 0 10px;}
.shop-row{display:flex;flex-wrap:wrap;gap:6px;}
.shop-chip{
  font-size:11.5px;font-weight:600;padding:7px 12px;border-radius:999px;min-height:32px;
  text-decoration:none;border:1px solid var(--line);color:var(--ink-soft);
  display:inline-flex;align-items:center;gap:4px;transition:all .15s ease;
}
.shop-chip:hover{border-color:var(--ink);color:var(--ink);}
.shop-chip svg{width:10px;height:10px;opacity:0.6;}

.ref-card{
  background:transparent;border:1px dashed var(--line);border-radius:var(--radius);
  padding:13px 16px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-soft);
  text-decoration:none;transition:border-color .15s ease,color .15s ease;min-height:44px;
}
.ref-card:hover{border-color:var(--ink-faint);color:var(--ink);}
.ref-card svg{flex-shrink:0;opacity:0.5;}

.kit-group{margin-bottom:38px;}
.kit-group:last-child{margin-bottom:0;}
.kit-group-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.kit-group-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--spot);color:var(--spot-deep);}
.kit-group.mask .kit-group-icon{background:var(--mask);color:var(--mask-deep);}
.kit-group.scrub .kit-group-icon{background:var(--scrub);color:var(--scrub-deep);}
.kit-group-title{font-size:14.5px;font-weight:700;}
.kit-group-sub{font-size:11.5px;color:var(--ink-soft);font-weight:500;}
.kit-group .card-icon{background:var(--spot);color:var(--spot-deep);}
.kit-group.mask .card-icon{background:var(--mask);color:var(--mask-deep);}
.kit-group.scrub .card-icon{background:var(--scrub);color:var(--scrub-deep);}

.kit-analysis{
  display:flex;gap:9px;font-size:12.5px;color:var(--ink-soft);line-height:1.6;
  margin:-2px 0 14px;padding:11px 14px;background:#F7F5EF;border-radius:10px;border:1px solid var(--line);
}
.kit-analysis svg{flex-shrink:0;margin-top:2px;opacity:0.6;}
.kit-analysis b{color:var(--ink);font-weight:600;}

.card-warning{
  display:flex;align-items:flex-start;gap:5px;color:var(--danger-ink);
  font-size:11.5px;font-weight:600;line-height:1.4;margin:6px 0 10px;
}
.card-warning svg{flex-shrink:0;margin-top:1px;}

.rules-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:26px;}
.rule{
  display:flex;gap:12px;padding:16px 18px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);
  transition:transform .18s ease,box-shadow .18s ease;
}
.rule:hover{transform:translateY(-3px);box-shadow:var(--shadow-card);}
.rule.caution{background:var(--danger-bg);border-color:var(--danger-border);}
.rule-num{
  width:24px;height:24px;border-radius:50%;background:#EFEAE0;color:#7A6A4B;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;
}
.rule.caution .rule-num{background:#F4D3D3;color:var(--danger-ink);}
.rule-text{font-size:13px;line-height:1.55;color:var(--ink);}
.rule.caution .rule-text{color:var(--danger-ink);display:flex;gap:7px;align-items:flex-start;}
.rule.caution .rule-text svg{flex-shrink:0;margin-top:2px;}
.rule-text b{font-weight:700;}

.shops-section{padding:48px 0 40px;}
.shops-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:24px;}
.shop-card{
  border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;background:var(--surface);
  transition:transform .18s ease,box-shadow .18s ease;
}
.shop-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-card);}
.shop-card-name{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:700;margin-bottom:6px;}
.shop-card-name a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:5px;}
.shop-card-name a:hover{text-decoration:underline;}
.shop-card-items{font-size:12px;color:var(--ink-soft);line-height:1.55;}

/* ---------- КАЛЕНДАРЬ ---------- */
.calendar-container{
  background:var(--surface);border-radius:var(--radius);padding:20px;
  border:1px solid var(--line);box-shadow:var(--shadow-card);max-width:500px;
  margin-top:20px;
}
.calendar-header{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;
}
.calendar-header h3{
  font-weight:600;margin:0;font-size:18px;color:var(--ink);
}
.calendar-nav-btn{
  background:none;border:none;font-size:22px;cursor:pointer;padding:4px 12px;
  color:var(--ink-soft);transition:0.15s;
}
.calendar-nav-btn:hover{color:var(--ink);transform:scale(1.1);}
.calendar-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;
}
.calendar-weekdays{
  font-weight:600;color:var(--ink-soft);font-size:12px;padding-bottom:6px;
}
.calendar-day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:8px;cursor:pointer;transition:0.15s;font-weight:500;
  background:var(--bg);color:var(--ink);
}
.calendar-day:hover{transform:scale(1.05);}
.calendar-day.marked{background:var(--morning-deep);color:#fff;}
.calendar-day.empty{background:transparent;cursor:default;}

/* ---------- FOOTER ---------- */
footer{border-top:1px solid var(--line);padding:36px 0 44px;margin-top:20px;}
.footer-case{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:26px;position:relative;overflow:hidden;
}
.footer-case::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--morning-deep),var(--evening-deep));
}
.footer-case-eyebrow{
  font-size:10.5px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;
  color:var(--morning-deep);margin:0 0 6px;
}
.footer-case p.footer-case-text{font-size:12.5px;line-height:1.6;color:var(--ink-soft);margin:0;max-width:760px;}
.footer-case p.footer-case-text b{color:var(--ink);font-weight:600;}
footer .footer-bottom{text-align:center;}
footer .footer-bottom p{font-size:12px;color:var(--ink-faint);margin:0;}
footer .footer-credit{font-size:11.5px;color:var(--ink-faint);margin-top:8px;letter-spacing:0.02em;}

/* ==========================================================
   RESPONSIVE
   ========================================================== */
@media(min-width:601px){
  .wrap{padding:0 28px;}
  .header-top{padding:24px 0 14px;align-items:baseline;}
  .tools{width:auto;padding-bottom:16px;}
  nav{padding-bottom:16px;}
  .hero{padding:40px 0 12px;}
  .stats{grid-template-columns:repeat(4,1fr);gap:12px;}
  .stat{padding:16px 20px;}
  section.zone{padding:64px 0 10px;}
  .split{grid-template-columns:1fr 1fr;gap:22px;}
  .card-row{grid-template-columns:repeat(2,1fr);gap:16px;}
  .rules-grid{grid-template-columns:1fr 1fr;gap:14px;margin-top:30px;}
  .shops-grid{grid-template-columns:repeat(2,1fr);gap:16px;}
}
@media(min-width:1025px){
  .card-row{grid-template-columns:repeat(3,1fr);}
  .shops-grid{grid-template-columns:repeat(3,1fr);}
  section.zone{padding:72px 0 10px;}
  .hero{padding:44px 0 12px;}
}
@media(max-width:600px){
  .header-top{padding:16px 0 10px;}
  .subtitle{max-width:100%;}
  .tools{gap:8px;}
  .search-box{min-width:0;max-width:none;flex:1 1 100%;order:3;}
  .pill-toggle{flex:1;justify-content:center;}
  .result-count{width:100%;text-align:center;order:4;}
  nav a{padding:10px 14px;font-size:12.5px;}
  .footer-case{padding:16px 16px;}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="header-top">
      <div>
        <p class="title" id="siteTitle"><span class="accent">Skincare</span> Guide</p>
        <p class="subtitle" id="siteSubtitle"></p>
      </div>
      <div class="tools">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search" type="text" placeholder="">
        </div>
        <button class="pill-toggle" id="recToggle">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <span id="recToggleLabel"></span>
        </button>
        <button class="lang-toggle" id="langToggle" aria-label="Switch language"></button>
        <span class="result-count" id="resultCount"></span>
      </div>
    </div>
    <nav id="mainNav">
      <a href="#morning" data-nav="morning"></a>
      <a href="#evening" data-nav="evening"></a>
      <a href="#kit" data-nav="kit"></a>
      <a href="#rules" data-nav="rules"></a>
      <a href="#shops" data-nav="shops"></a>
      <a href="#calendar" data-nav="calendar"></a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <div class="stats">
      <div class="stat stat-morning">
        <div class="stat-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg></div>
        <div><div class="num">4</div><div class="lbl" id="statMorningLbl"></div></div>
      </div>
      <div class="stat stat-evening">
        <div class="stat-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></div>
        <div><div class="num">5</div><div class="lbl" id="statEveningLbl"></div></div>
      </div>
      <div class="stat stat-kit">
        <div class="stat-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg></div>
        <div><div class="num">6</div><div class="lbl" id="statKitLbl"></div></div>
      </div>
      <div class="stat stat-rules">
        <div class="stat-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></div>
        <div><div class="num">8</div><div class="lbl" id="statRulesLbl"></div></div>
      </div>
    </div>
  </div>

  <div class="no-results" id="noResults"></div>

  <section class="zone morning" id="morning">

/* ============================================================
   HELPERS
   ============================================================ */
function tr(field){
  if(field == null) return '';
  if(typeof field === 'string') return field;
  return field[currentLang] != null ? field[currentLang] : (field.ru || '');
}
function shopChips(shops){
  return '<div class="shop-row">'+shops.map(s=>`<a class="shop-chip" href="${s.url}" target="_blank" rel="noopener">${tr(s.name)}${ICONS.link}</a>`).join('')+'</div>';
}
function productCard(p, zoneClass){
  const name = tr(p.name);
  const comment = tr(p.comment);
  return `<div class="card product-card ${zoneClass}${p.lux?' lux-card':''}" data-name="${name.toLowerCase()}" data-comment="${comment.toLowerCase()}" data-rec="${p.rec?1:0}">
    <div class="card-icon">${ICONS[p.icon]}</div>
    <div class="card-body">
      <div class="card-name-row">
        <div class="card-name">${name}</div>
        <div class="card-price">${p.price}</div>
      </div>
      ${p.rec?'<div class="star-badge"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>'+STR[currentLang].recommended+'</div>':''}
      ${p.lux?'<div class="lux-badge">'+ICONS.lux+STR[currentLang].luxAlt+'</div>':''}
      <div class="card-comment">${comment}</div>
      ${p.warning?'<div class="card-warning">'+ICONS.warn+tr(p.warning)+'</div>':''}
      ${p.shops && p.shops.length ? shopChips(p.shops) : ''}
    </div>
  </div>`;
}
function refCard(text, anchor){
  return `<a class="ref-card" href="${anchor}">${ICONS.ref}${tr(text)}</a>`;
}
function renderPath(container, steps, zoneClass){
  container.innerHTML = steps.map(s=>{
    let body = '';
    if(s.ref){
      body = refCard(s.ref, s.anchor || '#morning');
    } else if(s.split){
      body = `<div class="split">
        <div><div class="split-col-label">${tr(s.split.a.title)}</div><div class="card-row">${s.split.a.products.map(p=>productCard(p, zoneClass)).join('')}</div></div>
        <div><div class="split-col-label">${tr(s.split.b.title)}</div><div class="card-row">${s.split.b.products.map(p=>productCard(p, zoneClass)).join('')}</div></div>
      </div>`;
    } else {
      body = `<div class="card-row">${s.products.map(p=>productCard(p, zoneClass)).join('')}</div>`;
    }
    return `<div class="step ${zoneClass}">
      <div class="step-node">${s.num}</div>
      <div class="step-label">${tr(s.label)}</div>
      ${body}
    </div>`;
  }).join('');
}

/* ============================================================
   КАЛЕНДАРЬ
   ============================================================ */
let calendarYear = new Date().getFullYear();
let calendarMonth = new Date().getMonth();

function renderCalendar() {
  const container = document.getElementById('calendar-container');
  if (!container) return;

  const year = calendarYear;
  const month = calendarMonth;
  const firstDay = new Date(year, month, 1).getDay(); // 0 = Sunday
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // Получаем отметки
  const key = `skincare_calendar_${year}_${month}`;
  const marks = JSON.parse(localStorage.getItem(key)) || {};

  const monthName = new Date(year, month).toLocaleString(currentLang === 'ru' ? 'ru-RU' : 'en-US', { month: 'long', year: 'numeric' });
  const weekDays = currentLang === 'ru' ? ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'] : ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  let html = `<div class="calendar-header">
    <button class="calendar-nav-btn" id="prevMonthBtn">‹</button>
    <h3>${monthName}</h3>
    <button class="calendar-nav-btn" id="nextMonthBtn">›</button>
  </div>
  <div class="calendar-grid">
    <div class="calendar-weekdays" style="grid-column:1/8; display:grid; grid-template-columns:repeat(7,1fr);">
      ${weekDays.map(d => `<div>${d}</div>`).join('')}
    </div>`;

  // Смещение, чтобы понедельник был первым
  let startOffset = (firstDay === 0) ? 6 : firstDay - 1;
  for (let i = 0; i < startOffset; i++) {
    html += `<div class="calendar-day empty"></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isMarked = marks[dateStr] || false;
    html += `<div class="calendar-day${isMarked ? ' marked' : ''}" data-date="${dateStr}" onclick="toggleDay(this)">${d}</div>`;
  }

  html += `</div>`;
  container.innerHTML = html;

  // Обработчики навигации
  document.getElementById('prevMonthBtn')?.addEventListener('click', () => changeMonth(-1));
  document.getElementById('nextMonthBtn')?.addEventListener('click', () => changeMonth(1));
}

function toggleDay(el) {
  const date = el.dataset.date;
  if (!date) return;
  const parts = date.split('-');
  const year = parseInt(parts[0]);
  const month = parseInt(parts[1]) - 1;
  const key = `skincare_calendar_${year}_${month}`;
  let marks = JSON.parse(localStorage.getItem(key)) || {};
  marks[date] = !marks[date];
  localStorage.setItem(key, JSON.stringify(marks));
  renderCalendar(); // перерисовать
}

function changeMonth(delta) {
  calendarMonth += delta;
  if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
  if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
  renderCalendar();
}

/* ============================================================
   SEARCH / FILTER
   ============================================================ */
const searchInput = document.getElementById('search');
const recToggle = document.getElementById('recToggle');

function applyFilters(){
  const q = searchInput.value.trim().toLowerCase();
  const onlyRec = recToggle.classList.contains('active');
  let visibleCount = 0;
  document.querySelectorAll('.product-card').forEach(card=>{
    const name = card.dataset.name;
    const comment = card.dataset.comment;
    const isRec = card.dataset.rec === '1';
    const matchesQuery = !q || name.includes(q) || comment.includes(q);
    const matchesRec = !onlyRec || isRec;
    const show = matchesQuery && matchesRec;
    card.style.display = show ? '' : 'none';
    if(show) visibleCount++;
  });
  const noResults = document.getElementById('noResults');
  const resultCount = document.getElementById('resultCount');
  noResults.style.display = visibleCount === 0 ? 'block' : 'none';
  resultCount.textContent = (q || onlyRec) ? `${STR[currentLang].found}: ${visibleCount}` : '';
}
searchInput.addEventListener('input', applyFilters);
recToggle.addEventListener('click', ()=>{
  recToggle.classList.toggle('active');
  applyFilters();
});
